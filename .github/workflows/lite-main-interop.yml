name: burnerpad-lite main interoperability

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: burnerpad/burnerpad-lite
          ref: main
          path: burnerpad-lite
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: burnerpad-lite/.tool-versions
          version-type: strict
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: burnerpad-lite/.tool-versions }
      - run: mix deps.get
        working-directory: burnerpad-lite
      - run: npm ci
        working-directory: burnerpad-lite/test/browser
      - name: Browser and Go CLI interoperability against Lite main
        shell: bash
        run: scripts/run-lite-interop.sh
