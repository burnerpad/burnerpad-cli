# Nightly long fuzz. Crashers get committed as
# regression tests; the committed corpus replays as ordinary tests on every push.
name: fuzz-nightly
on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: go test ./envelope -fuzz FuzzDecodeCanonical -fuzztime 10m
      - run: go test ./internal/id -fuzz FuzzNormalizeID -fuzztime 5m
      - run: go test ./internal/id -fuzz FuzzParseShareURL -fuzztime 5m
      - name: upload any new crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: |
            envelope/testdata/fuzz
            internal/id/testdata/fuzz
