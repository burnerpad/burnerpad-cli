# Main CI: correctness gates on every push and pull request.
name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod } # go.mod, not the workflow, decides the compiler.
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: staticcheck
        run: |
          # GOBIN-only install so the module's go.mod/go.sum stay untouched (dep freeze).
          GOBIN="$RUNNER_TEMP/bin" go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          "$RUNNER_TEMP/bin/staticcheck" ./...
      - name: dependency freeze + import allowlist + decode gate
        run: ./scripts/check-deps.sh

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      # Full suite including every applicable suite-0x02 vector — a red
      # supported vector cannot merge.
      - run: go test ./...

  pinned-lite-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: lite
        name: Read the reviewed burnerpad-lite revision
        shell: bash
        run: echo "revision=$(tr -d '\r\n' < .burnerpad-lite-revision)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: burnerpad/burnerpad-lite
          ref: ${{ steps.lite.outputs.revision }}
          path: burnerpad-lite
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          version-file: burnerpad-lite/.tool-versions
          version-type: strict
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: burnerpad-lite/.tool-versions }
      - run: mix deps.get
        working-directory: burnerpad-lite
      - run: npm ci
        working-directory: burnerpad-lite/test/browser
      - name: Browser and Go CLI interoperability
        shell: bash
        run: scripts/run-lite-interop.sh

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: bounded fuzz on the attacker-byte parsers
        run: |
          go test ./envelope -fuzz FuzzDecodeCanonical -fuzztime 30s
          go test ./internal/id -fuzz FuzzNormalizeID -fuzztime 20s
          go test ./internal/id -fuzz FuzzParseShareURL -fuzztime 20s

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: build all six targets with the canonical flags block
        run: make cross
      - name: size gate ≤ 9 MiB
        run: ./scripts/check-size.sh dist/*
